<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISCC Poster — A4 {{FORMAT}} · {{THEME}}</title>
<style>
/*@fonts*/
/* ISCC promotion poster. One source, two formats (A4 landscape / portrait), two arenas.
   Light streams out from behind the cup (rendered offline by tools/poster_rays.py); the edge strips are light tubes.
   ?bleed=3 adds 3 mm bleed; ?date=… sets the date, or click it and type. */
:root{--b:0mm;
  --fd:'Big Shoulders Display',sans-serif;--fb:'Archivo',sans-serif;--fcd:'Noto Serif SC',serif;
  --stage:#07090D;--ink:#EFE9DA;--ink2:#9AA3B2;--gold:#C9A44C;--ghost:rgba(239,233,218,.06);--refl:.3;
  --tube-ct:96,132,206;--tube-t:214,174,84;--tube-core:255,252,240;--tube-blend:screen}
.light{--stage:#E9E1CD;--ink:#14161C;--ink2:#4B5360;--gold:#7A5D22;--ghost:rgba(20,22,28,.06);--refl:.18;
  --tube-ct:21,41,78;--tube-t:176,138,62;--tube-core:21,41,78;--tube-blend:multiply}
.landscape{--W:297mm;--H:210mm;--cx:148.5mm;--cupT:58mm}
.portrait{--W:210mm;--H:297mm;--cx:105mm;--cupT:92mm}
body{--cupW:80mm;--cupH:99.2mm}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#24272c}
body{min-height:100vh;display:grid;place-items:center}
.sheet{position:relative;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b));overflow:hidden;background:var(--stage);color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;transform-origin:center;isolation:isolate}
.sheet>*{position:absolute}

.rays{inset:0;background:url({{RAYS}}) 50% 50%/cover no-repeat}
.ghost{font:900 250mm/.8 var(--fd);letter-spacing:-.02em;color:var(--ghost);white-space:nowrap}
.landscape .ghost{right:calc(var(--b) - 12mm);top:calc(var(--b) - 30mm)}
.portrait .ghost{right:calc(var(--b) - 18mm);bottom:calc(var(--b) - 40mm);font-size:230mm}
.refl{left:calc(var(--b) + var(--cx) - var(--cupW)/2);top:calc(var(--b) + var(--cupT) + var(--cupH) - .4mm);width:var(--cupW);height:var(--cupH);
  background:url({{CUP}}) center bottom/contain no-repeat;transform:scaleY(-1);transform-origin:top;opacity:var(--refl);
  filter:url(#liquid) blur(.4mm);-webkit-mask:linear-gradient(to top,#000,transparent 34%);mask:linear-gradient(to top,#000,transparent 34%)}
.cup{left:calc(var(--b) + var(--cx) - var(--cupW)/2);top:calc(var(--b) + var(--cupT));width:var(--cupW);height:var(--cupH);
  background:url({{CUP}}) center bottom/contain no-repeat;filter:brightness(1.12) contrast(1.06)}

/* the edge strips are light tubes: hot core, coloured falloff, uneven output along their length */
.tube{top:0;bottom:0;width:calc(var(--b) + 30mm);mix-blend-mode:var(--tube-blend);pointer-events:none;
  -webkit-mask:linear-gradient(to bottom,rgba(0,0,0,.5),#000 22%,rgba(0,0,0,.78) 50%,#000 74%,rgba(0,0,0,.55));mask:linear-gradient(to bottom,rgba(0,0,0,.5),#000 22%,rgba(0,0,0,.78) 50%,#000 74%,rgba(0,0,0,.55))}
.tube.ct{left:0;background:linear-gradient(90deg,rgba(var(--tube-core),.95) 0,rgba(var(--tube-core),.95) calc(var(--b) + .7mm),rgba(var(--tube-ct),.95) calc(var(--b) + 1.5mm),rgba(var(--tube-ct),.4) calc(var(--b) + 4mm),rgba(var(--tube-ct),.12) calc(var(--b) + 12mm),transparent calc(var(--b) + 30mm))}
.tube.t{right:0;background:linear-gradient(270deg,rgba(var(--tube-core),.95) 0,rgba(var(--tube-core),.95) calc(var(--b) + .7mm),rgba(var(--tube-t),.95) calc(var(--b) + 1.5mm),rgba(var(--tube-t),.4) calc(var(--b) + 4mm),rgba(var(--tube-t),.12) calc(var(--b) + 12mm),transparent calc(var(--b) + 30mm))}
.light .tube.ct{background:linear-gradient(90deg,rgb(var(--tube-ct)) 0,rgb(var(--tube-ct)) calc(var(--b) + 1.4mm),rgba(var(--tube-ct),.2) calc(var(--b) + 3.5mm),rgba(var(--tube-ct),.06) calc(var(--b) + 12mm),transparent calc(var(--b) + 28mm))}
.light .tube.t{background:linear-gradient(270deg,rgb(var(--tube-t)) 0,rgb(var(--tube-t)) calc(var(--b) + 1.4mm),rgba(var(--tube-t),.28) calc(var(--b) + 3.5mm),rgba(var(--tube-t),.08) calc(var(--b) + 12mm),transparent calc(var(--b) + 28mm))}
.grain{inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.45;background:var(--grain)}

/* type */
.trim{left:var(--b);top:var(--b);width:var(--W);height:var(--H)}
.trim>*{position:absolute}
.name{left:16mm;top:15mm;font:800 6mm/1.04 var(--fd);letter-spacing:.1em;text-transform:uppercase}
.name i{display:block;font:900 3.5mm/1.5 var(--fcd);font-style:normal;letter-spacing:.22em;margin-top:1.4mm;color:var(--gold)}
.trim>h1{inset:0;font-size:inherit}
.sl{position:absolute;font:900 44mm/1 var(--fcd);white-space:nowrap}
.landscape .s1{right:calc(var(--W) - var(--cx) + 46mm);top:62mm}
.landscape .s2{left:calc(var(--cx) + 46mm);top:62mm}
.portrait .sl{writing-mode:vertical-rl;font-size:40mm;letter-spacing:.04em;top:95mm}
.portrait .s1{left:13mm}.portrait .s2{right:13mm}
.cta{left:16mm;bottom:16mm;font:900 13.5mm/.86 var(--fd);letter-spacing:.015em;text-transform:uppercase;color:var(--gold)}
.portrait .cta{bottom:20mm;font-size:14mm}
.date{right:16mm;bottom:16mm;font:900 11.5mm/.9 var(--fd);letter-spacing:.03em;text-transform:uppercase;text-align:right;outline:none;min-width:20mm}
.portrait .date{bottom:20mm}
.date:focus{box-shadow:0 .4mm 0 var(--gold)}
.fine{left:16mm;bottom:9.5mm;font:400 1.8mm/1 var(--fb);letter-spacing:.06em;color:var(--ink2)}
.portrait .fine{bottom:11mm}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:600 11px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#cfd3da;white-space:nowrap}

/* on screen the light grows out from behind the cup; print and reduced motion get the final frame */
@property --r{syntax:'<length>';inherits:false;initial-value:400mm}
@media screen and (prefers-reduced-motion:no-preference){
  .grow .rays{animation:grow 2.6s cubic-bezier(.16,1,.3,1) both;
    -webkit-mask:radial-gradient(circle at var(--cx) calc(var(--cupT) + 26mm),#000 var(--r),transparent calc(var(--r) + 50mm));
            mask:radial-gradient(circle at var(--cx) calc(var(--cupT) + 26mm),#000 var(--r),transparent calc(var(--r) + 50mm))}
  .grow .cup,.grow .refl{animation:lift 1.4s cubic-bezier(.16,1,.3,1) both}
}
@keyframes grow{from{--r:0mm}to{--r:400mm}}
@keyframes lift{from{opacity:0}}
@media print{html,body{background:none;display:block;min-height:0}.sheet{transform:none!important}.hint{display:none}.date:focus{box-shadow:none}}
</style>
</head>
<body class="{{THEME}} {{FORMAT}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="sheet" id="sheet">
  <div class="rays"></div>
  <div class="ghost" aria-hidden="true">26</div>
  <div class="refl" aria-hidden="true"></div>
  <div class="cup" role="img" aria-label="The championship cup"></div>
  <div class="tube ct"></div><div class="tube t"></div>
  <div class="grain"></div>
  <div class="trim">
    <p class="name">International Schools<br>CS2 Championships<i lang="zh-Hans">国际学校CS2锦标赛</i></p>
    <h1 lang="zh-Hans" aria-label="百炼成徽"><span class="sl s1">百炼</span><span class="sl s2">成徽</span></h1>
    <p class="cta">Earn your<br>crest.</p>
    <p class="date" id="date" contenteditable="true" spellcheck="false">December 2026</p>
    <p class="fine">CS2 is a trademark of Valve Corporation. Not affiliated with or endorsed by Valve.</p>
  </div>
</div>
<p class="hint">Click the date to edit · print A4 {{FORMAT}}, margins none, background graphics on</p>
<script>
(function(){
  var q=new URLSearchParams(location.search),s=document.getElementById('sheet'),d=document.getElementById('date'),K='iscc-poster-date';
  var land=document.body.classList.contains('landscape'),W=land?297:210,H=land?210:297;
  var b=parseFloat(q.get('bleed')||'0');if(b>0)document.documentElement.style.setProperty('--b',b+'mm');
  document.documentElement.style.setProperty('--grain','url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27180%27 height=%27180%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.85%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix type=%27saturate%27 values=%270%27/%3E%3C/filter%3E%3Crect width=%27180%27 height=%27180%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")');
  try{var v=q.get('date')||localStorage.getItem(K);if(v)d.textContent=v}catch(e){}
  d.addEventListener('input',function(){try{localStorage.setItem(K,d.textContent)}catch(e){}});
  d.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();d.blur()}});
  var st=document.createElement('style');st.textContent='@page{size:'+(W+2*b)+'mm '+(H+2*b)+'mm;margin:0}';document.head.appendChild(st);
  if(q.get('raw'))document.querySelector('.hint').remove();else document.body.classList.add('grow');
  function fit(){if(q.get('raw')){s.style.transform='none';return}
    var k=Math.min((innerWidth-48)/s.offsetWidth,(innerHeight-72)/s.offsetHeight);s.style.transform='scale('+k+')'}
  addEventListener('resize',fit);addEventListener('beforeprint',function(){s.style.transform='none'});addEventListener('afterprint',fit);fit();
})();
</script>
</body>
</html>
