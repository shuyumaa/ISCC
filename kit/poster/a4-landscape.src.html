<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISCC Poster — A4 landscape · {{THEME}}</title>
<style>
/*@fonts*/
/* A4 landscape, 297 × 210 mm. ?bleed=3 adds 3 mm bleed; ?date=… sets the date line (or click it and type). */
:root{--b:0mm;--W:297mm;--H:210mm;
  --fd:'Big Shoulders Display',sans-serif;--fb:'Archivo',sans-serif;--fcd:'Noto Serif SC',serif;--fcb:'Noto Sans SC',sans-serif;
  --stage:#07090D;--ink:#EFE9DA;--ink2:#9AA3B2;--gold:#C9A44C;--lit:#E4CF9A;--ct:#4868A4;--t:#C9A44C;
  --ghost:rgba(239,233,218,.055);--ring:rgba(228,207,154,.5);--refl:.36;--bloom:rgba(228,207,154,.34);--floor:rgba(7,9,13,1)}
.light{--stage:#E9E1CD;--ink:#14161C;--ink2:#5B6470;--gold:#7A5D22;--lit:#7A5D22;--ct:#15294E;--t:#C9A44C;
  --ghost:rgba(20,22,28,.07);--ring:rgba(122,93,34,.42);--refl:.22;--bloom:rgba(250,247,239,.75);--floor:rgba(233,225,205,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3a3d43}
body{min-height:100vh;display:grid;place-items:center}
.sheet{position:relative;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b));overflow:hidden;background:var(--stage);color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;transform-origin:center;isolation:isolate}
.sheet>*{position:absolute}

/* light: rendered rays, aimed at the cup, dying into the floor */
.plate{inset:0;background:url({{BEAMS}}) 50% 50%/cover no-repeat;
  -webkit-mask:linear-gradient(#000 0 58%,rgba(0,0,0,.35) 72%,transparent 84%);mask:linear-gradient(#000 0 58%,rgba(0,0,0,.35) 72%,transparent 84%)}
.ghost{right:calc(var(--b) - 10mm);top:calc(var(--b) - 30mm);font:900 250mm/.8 var(--fd);letter-spacing:-.02em;color:var(--ghost);white-space:nowrap}
.bloom{left:50%;top:calc(var(--b) + 34mm);width:190mm;height:120mm;margin-left:-95mm;border-radius:50%;
  background:radial-gradient(closest-side,var(--bloom),transparent);mix-blend-mode:screen;filter:blur(2mm)}
.light .bloom{mix-blend-mode:normal}
.rail{top:0;bottom:0;width:calc(var(--b) + 2.2mm)}.rail.ct{left:0;background:var(--ct)}.rail.t{right:0;background:var(--t)}

/* the liquid floor */
.pool{left:0;right:0;top:calc(var(--b) + 161mm);bottom:0;
  background:linear-gradient(to bottom,transparent,var(--floor) 70%)}
.ripples{left:50%;top:calc(var(--b) + 161mm);width:280mm;height:44mm;margin:-22mm 0 0 -140mm;overflow:visible}
.ripples{filter:blur(.25mm)}.ripples ellipse{fill:none;stroke:var(--ring)}
.sheen{left:50%;top:calc(var(--b) + 160.8mm);width:250mm;height:.45mm;margin-left:-125mm;
  background:linear-gradient(90deg,transparent,var(--lit) 30%,#fff 50%,var(--lit) 70%,transparent);opacity:.6}
.light .sheen{background:linear-gradient(90deg,transparent,var(--gold) 30%,#FAF7EF 50%,var(--gold) 70%,transparent);opacity:.45}
.cup{filter:brightness(1.2) contrast(1.06);left:50%;top:calc(var(--b) + 64mm);width:78mm;height:96.7mm;margin-left:-39mm;background:url({{CUP}}) center bottom/contain no-repeat}
.refl{left:50%;top:calc(var(--b) + 160.6mm);width:78mm;height:96.7mm;margin-left:-39mm;background:url({{CUP}}) center bottom/contain no-repeat;
  transform:scaleY(-1);transform-origin:top;opacity:var(--refl);filter:url(#liquid) blur(.35mm) brightness(1.2);
  -webkit-mask:linear-gradient(to top,#000,transparent 38%);mask:linear-gradient(to top,#000,transparent 38%)}

/* type, on the trim */
.trim{left:var(--b);top:var(--b);width:var(--W);height:var(--H)}
.trim>*{position:absolute}
.name{left:16mm;top:14mm;font:800 6.4mm/1.04 var(--fd);letter-spacing:.1em;text-transform:uppercase}
.name i{display:block;font:900 3.7mm/1.5 var(--fcd);font-style:normal;letter-spacing:.22em;margin-top:1.4mm;color:var(--gold)}
.slogan{left:0;right:0;top:70mm;display:flex;justify-content:center;align-items:center;font:900 50mm/1 var(--fcd);white-space:nowrap}
.slogan .gap{width:88mm;flex:none}
.cta{left:16mm;bottom:15mm;font:900 14mm/.86 var(--fd);letter-spacing:.015em;text-transform:uppercase;color:var(--gold)}
.when{right:16mm;bottom:15mm;text-align:right}
.when small{display:block;font:600 2.5mm/1 var(--fb);letter-spacing:.28em;text-transform:uppercase;color:var(--ink2);margin-bottom:2.6mm}
.when small i{font-family:var(--fcb);font-style:normal;letter-spacing:.2em;margin-left:1.6mm}
.when b{display:block;font:900 12mm/.9 var(--fd);letter-spacing:.03em;text-transform:uppercase;outline:none;min-width:20mm}
.when b:focus{box-shadow:0 .4mm 0 var(--gold)}
.fine{left:0;right:0;bottom:5mm;text-align:center;font:400 1.9mm/1 var(--fb);letter-spacing:.06em;color:var(--ink2)}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:600 11px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#cfd3da}
@media print{html,body{background:none;display:block;min-height:0}.sheet{transform:none!important}.hint{display:none}.when b:focus{box-shadow:none}}
</style>
</head>
<body class="{{THEME}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="sheet" id="sheet">
  <div class="plate"></div>
  <div class="ghost" aria-hidden="true">26</div>
  <div class="bloom"></div>
  <div class="pool"></div>
  <svg class="ripples" viewBox="-140 -22 280 44" aria-hidden="true">
    <ellipse rx="30" ry="3.2" stroke-width=".45" opacity=".85"/><ellipse rx="44" ry="4.6" stroke-width=".3" opacity=".55"/>
    <ellipse rx="62" ry="6.4" stroke-width=".28" opacity=".38"/><ellipse rx="86" ry="8.8" stroke-width=".22" opacity=".22"/><ellipse rx="116" ry="11.8" stroke-width=".18" opacity=".12"/>
  </svg>
  <div class="refl" aria-hidden="true"></div>
  <div class="sheen" aria-hidden="true"></div>
  <div class="cup" role="img" aria-label="The championship cup"></div>
  <div class="rail ct"></div><div class="rail t"></div>
  <div class="trim">
    <p class="name">International Schools<br>CS2 Championships<i lang="zh-Hans">国际学校CS2锦标赛</i></p>
    <h1 class="slogan" lang="zh-Hans"><span>百炼</span><span class="gap"></span><span>成徽</span></h1>
    <p class="cta">Earn your<br>crest.</p>
    <p class="when"><small>Grand Final <i>总决赛</i></small><b id="date" contenteditable="true" spellcheck="false">Dates TBC</b></p>
    <p class="fine">CS2 is a trademark of Valve Corporation. Not affiliated with or endorsed by Valve.</p>
  </div>
</div>
<p class="hint">Click the date to edit · print at A4 landscape, margins none, background graphics on</p>
<script>
(function(){
  var q=new URLSearchParams(location.search),s=document.getElementById('sheet'),d=document.getElementById('date'),K='iscc-poster-date';
  var b=parseFloat(q.get('bleed')||'0');if(b>0)document.documentElement.style.setProperty('--b',b+'mm');
  try{var v=q.get('date')||localStorage.getItem(K);if(v)d.textContent=v}catch(e){}
  d.addEventListener('input',function(){try{localStorage.setItem(K,d.textContent)}catch(e){}});
  d.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();d.blur()}});
  var st=document.createElement('style');st.textContent='@page{size:'+(297+2*b)+'mm '+(210+2*b)+'mm;margin:0}';document.head.appendChild(st);
  if(q.get('raw'))document.querySelector('.hint').remove();
  function fit(){if(q.get('raw')){s.style.transform='none';return}
    var k=Math.min((innerWidth-48)/s.offsetWidth,(innerHeight-72)/s.offsetHeight);s.style.transform='scale('+k+')'}
  addEventListener('resize',fit);addEventListener('beforeprint',function(){s.style.transform='none'});addEventListener('afterprint',fit);fit();
})();
</script>
</body>
</html>
